<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Politi Loadout</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="app" class="hidden">
    <div class="loadout-panel">

      <div class="loadout-header">
        <div class="loadout-heading">
          <button id="backBtn" class="icon-btn hidden" title="Tilbage">
            <i class="fa-solid fa-arrow-left"></i>
          </button>
          <div>
            <h1 id="panelTitle">Politi Loadout</h1>
            <p id="panelSubtitle">Vælg dit udstyr og din enhed</p>
          </div>
        </div>
        <button id="closeBtn" class="icon-btn" title="Luk (ESC)">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div id="cardsGrid" class="cards-grid"></div>
      <div id="detailView" class="detail-view hidden"></div>

    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
